<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>카툰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
  /* 빛깔·모서리·글자는 조혼가구/에이엠티 화면에서 그대로 가져왔다. 새로 지어낸 값은 없다. */
  :root{
    --fluid-h1:clamp(1.5rem,5vw,2.25rem);
    --fluid-h2:clamp(1.125rem,4vw,1.5rem);
    --fluid-body:clamp(0.875rem,2.5vw,1.05rem);
    --fluid-small:clamp(0.75rem,2vw,0.875rem);
    --fluid-mini:clamp(0.65rem,1.5vw,0.75rem);
    --ink:#37352f; --bg:#ffffff; --line:#ededeb; --line2:#e3e2e0;
    --muted:#787774; --faint:#b0aeaa; --soft:#f7f6f3; --soft2:#f1f1ef; --hover:#fbfbfa;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:var(--fluid-body);-webkit-font-smoothing:antialiased;
  }
  .custom-scrollbar::-webkit-scrollbar{width:4px;height:4px}
  .custom-scrollbar::-webkit-scrollbar-track{background:transparent}
  .custom-scrollbar::-webkit-scrollbar-thumb{background:#d3d1cb;border-radius:10px}

  /* 머리띠 — 집 화면과 같은 흰 바탕에 아래 한 줄 */
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
  .hd{max-width:1152px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;
      justify-content:space-between;gap:12px}
  .hd-l{display:flex;align-items:center;gap:8px;min-width:0}
  .logo{font-weight:900;font-size:20px;letter-spacing:-.05em;color:var(--ink)}
  .badge{font-size:9px;font-weight:700;color:var(--faint);background:#f1f0ef;padding:1px 6px;
         border-radius:4px;letter-spacing:.04em;font-family:ui-monospace,monospace}

  .wrap{flex:1;display:flex;min-height:0}
  aside{width:280px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:12px 0 24px}
  .grp{padding:0 12px 14px}
  .grp+.grp{border-top:1px solid var(--line);padding-top:14px}
  .grp h2{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);
          margin:0 0 8px;padding:0 4px;text-transform:uppercase}

  /* 목록 단추 — 집의 nav-link 를 따랐다 */
  #list button{display:block;width:100%;text-align:left;background:none;border:0;
    padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);
    font:inherit;font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s}
  #list button:hover{background:var(--hover);color:var(--ink)}
  #list button.on{background:var(--soft2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;
       background:var(--hover)}
  main img{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line);
           background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  main .empty{color:var(--faint);font-size:var(--fluid-small);font-weight:600}

  /* 카드·단추·입력칸 — 집의 notion-card / notion-input 값 그대로 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
    padding:10px 12px;background:var(--ink);color:#fff;font:inherit;font-size:13px;font-weight:700;
    border:0;border-radius:8px;cursor:pointer;transition:all .2s}
  .btn:hover{background:#000}
  .btn:active{transform:scale(.95)}
  .btn[disabled]{background:#d3d1cb;cursor:not-allowed;transform:none}
  .inp{appearance:none;background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:8px 12px;font:inherit;font-size:16px;width:100%;transition:all .2s;
    resize:vertical;min-height:64px;line-height:1.45}
  .inp:focus{outline:none;border-color:var(--ink);background:var(--hover)}

  .note{font-size:11px;line-height:1.5;color:var(--muted);font-weight:600;margin-top:8px}
  .warn{background:#f7f6f3;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
        font-size:11px;font-weight:700;color:var(--ink);line-height:1.45;margin-top:8px}
  .bad{background:#fef2f2;border-color:#fecaca;color:#dc2626}

  /* ── 박스 (영감 자료 갈래) — 작업대의 새 박스를 본떴다.
     생김새 값은 집(조혼가구/에이엠티) 것을 쓴다: 모서리 6·8px, 빛깔 #37352f/#ededeb. */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;
    border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;font-weight:700;
    color:var(--muted);cursor:pointer;min-height:32px;transition:all .2s}
  .chip:hover{background:var(--hover);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.newbox{border-style:dashed;color:var(--faint)}
  .chip svg{display:block}

  /* 바닥에 늘 떠 있는 박스추가 단추 — 작업대와 같은 자리·같은 크기 */
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;
    width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;border:0;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(55,53,47,.26)}
  .fab:active{transform:scale(.94)}
  .sheet.on ~ .fab{display:none}

  /* 판 — 이 화면에 이미 있는 바이글 판과 같은 모양으로 맞췄다 */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(55,53,47,.4);
    display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet .card{background:#fff;width:100%;max-height:88vh;overflow:auto;
    border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
  .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 14px}
  .sheet h4{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
  .fld{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;
    font:inherit;font-size:16px;background:#fff;margin-bottom:10px}
  .fld:focus{outline:none;border-color:var(--ink)}
  /* 아이콘 칸은 잘게. 테두리를 없애고 틈을 줄여 한 눈에 많이 들어오게 한다.
     칸이 좁아지는 만큼 고른 것은 먹빛으로 꽉 채워 멀리서도 보이게 했다. */
  .icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:3px;
    margin-top:6px;max-height:40vh;overflow-y:auto;padding-right:2px}
  .icogrid button{aspect-ratio:1;border:0;background:none;border-radius:4px;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .icogrid button:hover{background:var(--soft2)}
  .icogrid button.on{background:var(--ink);color:#fff}
  .icohead{grid-column:1/-1;margin:8px 0 0;font-size:11px;font-weight:800;color:var(--muted)}
  .icohead:first-child{margin-top:0}
  .danger{background:#fff;color:#dc2626;border:1px solid var(--line)}
  .danger:hover{background:#fef2f2}
  /* 링크 붙여넣기는 고르기 뒤로 물렸다. 안 될 때 쓰는 자리다. */
  .lnk{display:block;width:100%;margin-top:8px;padding:6px;background:none;border:0;
    font:inherit;font-size:11px;font-weight:700;color:var(--muted);text-decoration:underline;
    cursor:pointer;min-height:32px}
  .lnk:hover{color:var(--ink)}
  #dsetup a{color:var(--ink);font-weight:700}
  #dsetup ol{margin:6px 0 0;padding-left:16px}
  #dsetup li{margin:4px 0}

  /* 붙여 넣은 영감 자료 — 폰에서 세 칸 */
  #dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  #dgrid:empty{display:none}
  .thumb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:var(--soft);transition:all .2s}
  .thumb:hover{border-color:var(--faint)}
  .thumb.on{box-shadow:inset 0 0 0 2px var(--ink);border-color:var(--ink)}
  .thumb .pick{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;
    background:none;cursor:pointer;display:block}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  /* 이 그림이 어느 박스에 담겼는지. 눌러서 다른 박스로 옮긴다. */
  .thumb .bx{position:absolute;left:0;right:0;bottom:0;height:24px;padding:0 5px;border:0;
    font:inherit;font-size:9px;font-weight:700;color:#fff;text-align:left;cursor:pointer;
    background:linear-gradient(transparent,rgba(55,53,47,.86));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:flex-end;
    padding-bottom:4px}
  .thumb .bx:hover{background:rgba(55,53,47,.9)}
  /* 화면 목록에서만 뺀다. 드라이브 파일은 그대로 있다. 폰에서 눌리게 32px. */
  .thumb .x{position:absolute;top:2px;right:2px;width:32px;height:32px;padding:0;border:0;
    border-radius:8px;background:rgba(55,53,47,.62);color:#fff;font:inherit;font-size:15px;
    font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .2s}
  .thumb .x:hover{background:rgba(55,53,47,.92)}
  .thumb .x:active{transform:scale(.9)}
  /* 링크가 아직 공개가 아닐 때 그 자리에 뜨는 쪽지 */
  .thumb .shut{position:absolute;inset:0;background:#fef2f2;color:#dc2626;font-size:9px;
    font-weight:700;line-height:1.3;padding:6px 5px 22px;text-align:left;overflow:hidden}
  .open{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;color:var(--muted);
        text-decoration:underline}
  .open:hover{color:var(--ink)}

  /* 가운데 빈 자리 — 아무것도 안 골랐을 때 박스를 여기 펼친다.
     ＋ 칸은 작업대의 새 박스처럼 점선으로 둔다. 빛깔·모서리는 집 것 그대로. */
  .bhome{width:100%;max-height:100%;overflow:auto}
  /* 칸이 왼쪽부터 차므로 머리글도 왼쪽에 맞춘다 */
  .bhome h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;
    color:var(--muted);text-transform:uppercase;text-align:left}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .bcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:96px;padding:12px 8px;background:#fff;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
    color:var(--ink);transition:all .2s}
  .bcard:hover{background:var(--hover);border-color:var(--faint)}
  .bcard:active{transform:scale(.97)}
  .bcard.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bcard span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bcard.new{border-style:dashed;color:var(--faint)}
  .bcard.new:hover{color:var(--ink)}

  /* 폰(375px) — 옆으로 나란히 두면 그림 자리가 115px 밖에 안 남는다. 위아래로 쌓는다. */
  @media (max-width:640px){
    .wrap{flex-direction:column}
    aside{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:56vh}
    main{padding:16px;min-height:38vh}
  }
  @media (min-width:1024px){ #dgrid{grid-template-columns:repeat(3,1fr)} }
  /* 노트북에서 그림이 너무 컸다. 목록 그림이 아니라 크게 띄운 그림이다 —
     목록은 옆칸(280px) 안에 있어 노트북에서 오히려 폰보다 작다(81px 대 113px).
     크게 띄운 그림만 넓은 화면에서 절반으로 줄인다. 폰은 그대로. */
  @media (min-width:641px){ main img{max-width:50%;max-height:50%} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="hd-l"><div class="logo">VIVIVIC</div><span class="badge">카툰</span></div>
    <span id="dstate" class="badge"></span>
  </div>
</header>

<div class="wrap">
  <aside class="custom-scrollbar">
    <div class="grp">
      <h2>이 폴더</h2>
      <div id="list"></div>
    </div>
    <div class="grp">
      <h2>영감 자료 · 드라이브</h2>
      <div class="chips" id="dboxes"></div>
      <div id="drive">
        <button class="btn" id="dup">그림 올리기</button>
        <input type="file" id="dfile" accept="image/*" multiple hidden>
        <button class="lnk" id="dmore">다른 방법 — 링크 · 드라이브</button>
        <div id="dsetup"></div>
        <div id="dother" hidden>
        <button class="btn" id="dpick" style="background:var(--soft);color:var(--ink);border:1px solid var(--line)">드라이브에서 고르기</button>
        <button class="lnk" id="dtoggle">링크로 넣기</button>
        <div id="dpaste" hidden>
          <textarea id="dlink" class="inp" rows="2"
            placeholder="드라이브 공유 링크를 붙여 넣으세요. 여러 개를 한꺼번에 넣어도 됩니다."></textarea>
          <button class="btn" id="dadd" style="margin-top:8px">넣기</button>
        </div>
        </div>
        <div id="dmsg"></div>
      </div>
      <div id="dgrid"></div>
    </div>
  </aside>
  <main id="view"><span class="empty">이미지를 선택하세요</span></main>
</div>

<div class="sheet" id="sheet"><div class="card" id="sheetcard"></div></div>
<button class="fab" id="fab" aria-label="박스추가" title="박스추가">＋</button>
<script src="https://vivivic-cloud.github.io/vivivic-apps/shared/lucide.min.js"></script>

<script>
const list=document.getElementById('list'),view=document.getElementById('view');
let cur=null,prev='';
// 드라이브 그림을 띄웠을 때 이 칸을 비운다. 안 비우면 폴더 목록이 바뀌는 순간
// 아래 load() 가 먼저 보던 폴더 그림을 도로 띄워 버린다.
window.카툰비우기=()=>{cur=null};
function show(f){
  cur=f;
  view.innerHTML='';
  const img=new Image();img.src=encodeURIComponent(f);img.alt=f;view.appendChild(img);
  [...list.children].forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  const g=document.getElementById('dgrid');
  if(g)[...g.children].forEach(b=>b.classList.remove('on'));
}
async function load(){
  let files;
  try{files=await (await fetch('/api/list')).json();}catch(e){files=await (await fetch('images.json')).json();}
  const key=files.join('\n');if(key===prev)return;prev=key;
  list.innerHTML='';
  files.forEach(f=>{const b=document.createElement('button');b.textContent=f;b.dataset.f=f;b.onclick=()=>show(f);list.appendChild(b)});
  if(cur&&files.includes(cur))show(cur);
}
load();
setInterval(load,3000);
</script>

<script type="module">
/* ── 영감 자료를 드라이브에서 불러오는 자리 ─────────────────────────────
   여기는 서버가 없는 정적 화면이라 브라우저가 구글에 바로 물어야 한다.
   그런데 폴더 '안에 무엇이 있는지 목록을 읽는 것' 만 열쇠가 필요하고,
   링크 공개된 그림 한 장을 '보여 주는 것' 은 열쇠도 로그인도 필요 없다.
     https://drive.google.com/thumbnail?id=<파일id>&sz=w400
   그래서 목록 읽기를 없애고, 사장님이 공유 링크를 붙여 넣으시게 했다.
   열쇠가 하나도 필요 없다.

   붙여 넣은 것은 파이어스토어에 담는다. 폰에서 넣으면 넓은 화면에도 따라온다.
   담는 곳:  artifacts/vivivic-4b7ef/public/data/cartoon_refs/{파일id}
   다른 프로그램 칸(wt_boxes·wt_dev·confirmed_orders·cutting_plans)은 건드리지 않는다.

   드라이브 파일은 읽기만 한다. ✕ 는 이 화면 목록에서 빼는 것이고
   드라이브의 파일을 지우는 것이 아니다. 구글로 가는 것은 그림 GET 뿐이다.

   ── 드라이브에서 고르기 (Picker) ────────────────────────────────────
   앞세운 길이다. 집이 이미 쓰는 파이어베이스가 곧 구글 클라우드 프로젝트라
   새로 만들 것이 없다. 파이어베이스 구글 로그인으로 토큰을 받아 피커를 연다.
     프로젝트 번호(appId) 830175660542 · 프로젝트 vivivic-4b7ef
   권한은 drive.file 만 쓴다 — 사장님이 그 창에서 고른 파일만 앱에 보이고,
   구글 심사(restricted scope)도 받지 않는다. drive.readonly 는 쓰지 않는다. */
const 프로젝트번호='830175660542';
const 웹열쇠='AIzaSyB9X_hzd2D3goQ7oenK53Pz805P1c7oSqs';

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs, writeBatch }
  from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js";

const app = initializeApp({
  apiKey: 웹열쇠,
  authDomain: "vivivic-4b7ef.firebaseapp.com",
  projectId: "vivivic-4b7ef",
  storageBucket: "vivivic-4b7ef.firebasestorage.app",
  messagingSenderId: "830175660542",
  appId: "1:830175660542:web:9054030480c8280af8d8af"
});
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
const 뿌리 = ['artifacts', 'vivivic-4b7ef', 'public', 'data'];
const 칸 = (이름, id) => id ? doc(db, ...뿌리, 이름, id) : collection(db, ...뿌리, 이름);

const drive=document.getElementById('drive'), dgrid=document.getElementById('dgrid'),
      dmsg=document.getElementById('dmsg'), dstate=document.getElementById('dstate'),
      dlink=document.getElementById('dlink'), dadd=document.getElementById('dadd'),
      dpick=document.getElementById('dpick'), dsetup=document.getElementById('dsetup'),
      dtoggle=document.getElementById('dtoggle'), dpaste=document.getElementById('dpaste'),
      dup=document.getElementById('dup'), dfile=document.getElementById('dfile'),
      dmore=document.getElementById('dmore'), dother=document.getElementById('dother'),
      view2=document.getElementById('view'), list2=document.getElementById('list');

dtoggle.onclick=()=>{dpaste.hidden=!dpaste.hidden;dtoggle.textContent=dpaste.hidden?'링크로 넣기':'링크 넣는 칸 접기'};
dmore.onclick=()=>{dother.hidden=!dother.hidden;
  dmore.textContent=dother.hidden?'다른 방법 — 링크 · 드라이브':'다른 방법 접기';

/* ── 아이콘 — 집이 함께 쓰는 lucide 를 그대로 쓴다 (작업대의 ico 를 베꼈다) ── */
const toPascal=s=>String(s).split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('');
function ico(name,sz=16,stroke){
  const L=window.lucide&&window.lucide.icons; if(!L) return '';      // 못 받아 왔으면 글자만 뜬다
  const n=L[toPascal(name)]||L.Square; if(!n) return '';
  const [,attrs,kids]=n;
  const a=Object.assign({},attrs,{width:sz,height:sz,'stroke-width':stroke||1.7});
  return `<svg ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}>`
    +kids.map(([t,p])=>`<${t} ${Object.entries(p).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`).join('')+`</svg>`;
}

/* ── 붙여 넣은 글에서 드라이브 파일 아이디를 뽑는다 ──────────────────
   생김새가 여러 가지다. 줄바꿈·쉼표·빈칸으로 갈라 한꺼번에 받는다. */
function 아이디뽑기(글){
  const 아이디=[]; let 폴더=0, 모름=0;
  (글||'').split(/[\s,]+/).filter(Boolean).forEach(조각=>{
    // 폴더 링크는 목록을 읽어야 하는데 그건 열쇠가 있어야 한다. 먼저 걸러낸다.
    if(/drive\.google\.com\/drive\/(u\/\d+\/)?folders\//.test(조각)){폴더++;return}
    let m=조각.match(/\/d\/([A-Za-z0-9_-]{10,})/)          // …/file/d/<id>/view, docs…/d/<id>/…
       || 조각.match(/[?&]id=([A-Za-z0-9_-]{10,})/);        // …/open?id=<id>, …/uc?id=<id>
    let id=m?m[1]:(/^[A-Za-z0-9_-]{20,}$/.test(조각)?조각:null);   // 아이디만 덜렁
    if(id){ if(!아이디.includes(id)) 아이디.push(id); } else 모름++;
  });
  return {아이디,폴더,모름};
}

const 그림주소=(id,폭)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${폭}`;
const 원본주소=id=>`https://drive.google.com/file/d/${id}/view`;

/* 드라이브 자격. 고르기로 로그인하면 채워진다. 붙여넣기 길은 이것 없이도 된다. */
let 토큰=null;
/* 링크 공개가 아닌 그림(고르기로 담은 것)은 위 주소로는 안 뜬다.
   자격이 있으면 그것으로 받아 온다. 받아 오기만 한다 — GET 뿐이다. */
async function 토큰그림(id){
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
    {headers:{Authorization:'Bearer '+토큰}});
  if(!r.ok) throw new Error('구글이 '+r.status+' 로 답했습니다');
  return URL.createObjectURL(await r.blob());
}
// 올린 그림은 그 주소가 곧 그림이다. 드라이브 것만 아래 되받기가 필요하다.
const 올린것=x=>x&&x.kind==='올린것'&&x.url;
// 먼저 공개 주소로 걸어 보고, 안 되면 자격으로 다시 받는다. 그래도 안 되면 까닭을 적는다.
function 그림걸기(img,x,폭,실패했을때){
  if(올린것(x)){ img.onerror=()=>실패했을때(); img.src=x.url; return; }
  let 다시썼다=false;
  img.onerror=async()=>{
    if(다시썼다||!토큰) return 실패했을때();
    다시썼다=true;
    try{ img.src=await 토큰그림(x.id); }catch(e){ 실패했을때(); }
  };
  img.src=그림주소(x.id,폭);
}

    await Promise.all(아이디.map((id,i)=>setDoc(칸('cartoon_refs',id),{id,at:때+i,box:골른박스},{merge:true})));

  }catch(e){ 알림('넣지 못했습니다 — '+(e.code||e.message),true); }
  finally{ dadd.disabled=false;dadd.textContent='넣기'; }
}
dadd.onclick=넣기;

/* ── 그림 올리기 ─────────────────────────────────────────────────────
   앞세운 길이다. 구글 쪽에 켜 줄 것이 하나도 없다. 집이 이미 쓰는
   파이어베이스 저장소에 그대로 올린다 (vivivic-4b7ef.firebasestorage.app).
   올린 그림은 담긴 곳 주소가 곧 그림이라 다른 기기에서도 바로 뜬다. */
dup.onclick=()=>dfile.click();
dfile.onchange=async()=>{
  const 것들=[...dfile.files].filter(f=>f.type.startsWith('image/'));
  const 뺀것=dfile.files.length-것들.length;
  dfile.value='';                                   // 같은 그림을 또 골라도 열리게
  if(!것들.length) return 알림(뺀것?'그림 파일이 아닙니다':'',!!뺀것);
  dup.disabled=true;
  let 된것=0;
  try{
    for(const f of 것들){
      dup.textContent=`올리는 중… ${된것+1}/${것들.length}`;
      const id='up'+새id();
      const 길='cartoon/'+id;
      const r=sref(storage,길);
      await uploadBytes(r,f,{contentType:f.type||'image/jpeg'});
      const url=await getDownloadURL(r);
      await setDoc(칸('cartoon_refs',id),
        {id,at:Date.now()+된것,box:골른박스,kind:'올린것',url,path:길,name:f.name},{merge:true});
      된것++;
    }
    알림(된것+'장 올렸습니다'+(골른박스?' · '+박스이름(골른박스):'')
      +(뺀것?' · 그림이 아닌 '+뺀것+'개는 건너뛰었습니다':''),!!뺀것);
  }catch(e){
    알림((된것?된것+'장까지 올리고 멈췄습니다 — ':'올리지 못했습니다 — ')+(e.code||e.message),true);
  }finally{ dup.disabled=false;dup.textContent='그림 올리기'; }
};

/* ── 드라이브에서 고르기 ─────────────────────────────────────────────
   파이어베이스 구글 로그인으로 토큰을 받아(집이 이미 쓰는 그 프로젝트),
   그 토큰으로 구글 피커를 연다. 고른 것은 붙여넣기와 똑같이 cartoon_refs 에
   담기므로 박스도 다른 기기 따라오기도 그대로 된다. */
const 실어=주소=>new Promise((성공,실패)=>{
  const s=document.createElement('script');s.src=주소;s.onload=성공;
  s.onerror=()=>실패(new Error('구글 스크립트를 불러오지 못했습니다 — ' + 주소));
  document.head.appendChild(s);});

dpick.onclick=async()=>{
  dpick.disabled=true;dpick.textContent='드라이브 여는 중…';
  try{
    if(!토큰){
      const p=new GoogleAuthProvider();
      p.addScope('https://www.googleapis.com/auth/drive.file');   // 고른 파일만, 읽기용
      // 창을 새로 띄워 로그인한다. 틀(iframe) 안에 넣지 않는다 — 집 규칙이다.
      const r=await signInWithPopup(auth,p);
      토큰=(GoogleAuthProvider.credentialFromResult(r)||{}).accessToken||null;
      if(!토큰) throw new Error('구글이 드라이브 자격을 주지 않았습니다');
    }
    if(!window.gapi) await 실어('https://apis.google.com/js/api.js');
    await new Promise(r=>gapi.load('picker',r));
    const 보기=new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES)
      .setIncludeFolders(true).setSelectFolderEnabled(false);
    new google.picker.PickerBuilder()
      .setOAuthToken(토큰).setDeveloperKey(웹열쇠).setAppId(프로젝트번호)
      .addView(보기).enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
      .setCallback(async d=>{
        if(d[google.picker.Response.ACTION]!==google.picker.Action.PICKED)return;
        const 것들=d[google.picker.Response.DOCUMENTS]||[];
        const 때=Date.now();
        try{
          await Promise.all(것들.map((x,i)=>setDoc(칸('cartoon_refs',x.id),{id:x.id,at:때+i,box:골른박스},{merge:true})));
          알림(것들.length+'장 넣었습니다'+(골른박스?' · '+박스이름(골른박스):''));
        }catch(e){ 알림('넣지 못했습니다 — '+(e.code||e.message),true); }
      }).build().setVisible(true);
  }catch(e){
    const c=e.code||'';
    if(c==='auth/operation-not-allowed'||c==='auth/unauthorized-domain') 켜는법(c);
    else if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') 알림('');
    else 알림(e.message||'드라이브를 열지 못했습니다',true);
  }finally{ dpick.disabled=false;dpick.textContent='드라이브에서 고르기'; }
};

/* 켜기 전에는 무엇을 켜야 하는지 짧게만 띄운다. 누르면 그 화면이 바로 열린다. */
const 콘솔={
  로그인:'https://console.firebase.google.com/project/vivivic-4b7ef/authentication/providers',
  도메인:'https://console.firebase.google.com/project/vivivic-4b7ef/authentication/settings',
  드라이브API:'https://console.cloud.google.com/apis/library/drive.googleapis.com?project=vivivic-4b7ef',
  피커API:'https://console.cloud.google.com/apis/library/picker.googleapis.com?project=vivivic-4b7ef',
  열쇠:'https://console.cloud.google.com/apis/credentials?project=vivivic-4b7ef',
};
const 고리=(u,글)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${글}</a>`;
function 켜는법(){
  dsetup.innerHTML=`<div class="warn bad" style="margin-top:8px">드라이브 고르기를 켜려면 —
    <ol>
      <li>${고리(콘솔.로그인,'구글 로그인 켜기')}</li>
      <li>${고리(콘솔.도메인,'승인된 도메인에 vivivic-cloud.github.io 넣기')}</li>
      <li>${고리(콘솔.드라이브API,'Drive API')} · ${고리(콘솔.피커API,'Picker API')} 켜고,
          ${고리(콘솔.열쇠,'열쇠')}에서 이 둘을 풀기</li>
    </ol></div>`;
}

/* 켜져 있는지 물어본다 — 구글에 그냥 물으면 알려 준다. 열쇠는 안 쓴다.
   화면을 열 때가 아니라 '다른 방법' 을 펴 보실 때만 묻는다. 올리기로 쓰시는
   분께 구글 콘솔 이야기를 들이밀 일이 아니다. */
let 물어봤다=false;
async function 켜졌나(){
  if(물어봤다) return; 물어봤다=true;
  try{
    const [d,a]=await Promise.all([
      fetch(`https://identitytoolkit.googleapis.com/v1/projects?key=${웹열쇠}`).then(r=>r.json()),
      fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${웹열쇠}`,
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({providerId:'google.com',continueUri:location.origin+'/'})}).then(r=>r.json())
    ]);
    const 도메인됨=(d.authorizedDomains||[]).includes(location.hostname);
    const 로그인됨=!(a.error&&/OPERATION_NOT_ALLOWED/.test(a.error.message||''));
    if(!도메인됨||!로그인됨) 켜는법();
  }catch(e){ /* 물어보지 못했으면 조용히 둔다. 눌러 보면 그때 알려 준다. */ }
}

/* ── 익명으로 들어가고, 담긴 것을 따라온다 (집이 하는 그대로) ───────── */
fab.innerHTML=ico('plus',26)||'＋';
박스그리기(); 가운데박스();          // 파이어베이스가 닿기 전에도 칩 줄과 가운데는 보인다
상태('영감 자료 · 여는 중');
onAuthStateChanged(auth, u=>{
  if(!u) return signInAnonymously(auth).catch(e=>{
    상태('영감 자료 · 못 들어감'); 알림('들어가지 못했습니다 — '+(e.code||e.message),true); });
  // 다른 기기에서 넣거나 박스를 만들어도 따라온다
  onSnapshot(칸('cartoon_boxes'), s=>{
    박스들=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));
    박스읽었다=true;
    if(골른박스 && !박스들.some(b=>b.id===골른박스)) 골른박스='';   // 남이 지운 박스를 보고 있었으면 전체로
    박스그리기(); 그리기(); 가운데박스();      // 새로 만든 박스가 새로고침 없이 가운데에도 뜬다
  }, e=>{ 알림('박스를 불러오지 못했습니다 — '+(e.code||e.message),true); });
  onSnapshot(칸('cartoon_refs'), s=>{
    자료들=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));
    그리기();
  }, e=>{ 상태('영감 자료 · 못 읽음'); 알림('불러오지 못했습니다 — '+(e.code||e.message),true); });
});
</script>
